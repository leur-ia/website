name: Deploy

# Every push to main builds the site and publishes it on GitHub Pages (leuria.eu).

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # The overrides link the Leuria packages from ../leuria, which only exists
      # on a dev machine: here they come from npm.
      - name: Use the published Leuria packages
        run: |
          sed -i '/^# Until the Leuria packages/,$d' pnpm-workspace.yaml
          pnpm install --no-frozen-lockfile

      - run: pnpm build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
